name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Read app version
        id: ver
        run: echo "name=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Prepare signing key
        env:
          RELAY_KEYSTORE_BASE64: ${{ secrets.RELAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELAY_KEYSTORE_BASE64" ]; then
            echo "::error::RELAY_KEYSTORE_BASE64 secret is missing; refusing to publish an APK that cannot update the installed app."
            exit 1
          fi
          echo "$RELAY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/relay-release.jks"
          echo "RELAY_KEYSTORE_FILE=$RUNNER_TEMP/relay-release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          RELAY_KEYSTORE_PASSWORD: ${{ secrets.RELAY_KEYSTORE_PASSWORD }}
          RELAY_KEY_ALIAS: ${{ secrets.RELAY_KEY_ALIAS }}
          RELAY_KEY_PASSWORD: ${{ secrets.RELAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "nuvio-tv-relay-v${{ steps.ver.outputs.name }}.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-tv-relay-v${{ steps.ver.outputs.name }}-apk
          path: nuvio-tv-relay-v${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Nuvio TV Relay v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: nuvio-tv-relay-v${{ steps.ver.outputs.name }}.apk
